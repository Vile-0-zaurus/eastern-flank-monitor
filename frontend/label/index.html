<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold batch labeling</title>
<style>
  body { font-family: Georgia, serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; color: #1c1c1c; background: #f7f4ee; }
  button { font: inherit; margin: 0.2rem; padding: 0.45rem 0.8rem; cursor: pointer; }
  button.on { background: #1c1c1c; color: #fff; }
  .date, .outlet { color: #777; font-size: 0.85rem; }
  .en { font-size: 1.45rem; line-height: 1.35; }
  .ru { color: #555; }
  .card { background: #fff; border: 1px solid #ddd; padding: 1rem 1.2rem; }
  .frame { margin: 0.35rem 0; }
  .badge { font-size: 0.8rem; padding: 0.1rem 0.4rem; }
  .mild { background: #f3e2b5; }
  .strong { background: #e7b4a8; }
  textarea { width: 100%; min-height: 3.5rem; font: inherit; }
</style>
</head>
<body>
<h1>Headline labeling</h1>
<p id="progress"></p>
<article class="card">
  <p id="date" class="date"></p>
  <p id="outlet" class="outlet"></p>
  <h2 id="en" class="en"></h2>
  <p id="ru" class="ru"></p>
  <p>What is this headline?</p>
  <div id="choices"></div>
  <div id="frames"></div>
  <label>Note, optional <textarea id="notes"></textarea></label>
  <div>
    <button type="button" id="back">Back</button>
    <button type="button" id="next">Next</button>
  </div>
</article>
<p id="empty"></p>
<script>
const CHOICES = [
  ["1", "Not about region"],
  ["2", "Ordinary news"],
  ["3", "Hostile framing"],
  ["U", "Unsure"]
];
const FRAMES = [
  ["f1", "Persecuted Russians"],
  ["f2", "Nazism"],
  ["f3", "Illegitimate borders"],
  ["f4", "NATO aggression"],
  ["f5", "Russophobia"],
  ["f6", "Military threats"],
  ["f7", "Other"]
];
let items = [];
let i = 0;
function done(x) { return ["Not about region", "Ordinary news", "Hostile framing", "Unsure"].includes(x.v3 || ""); }
function firstOpen() { const n = items.findIndex(x => !done(x)); return n === -1 ? 0 : n; }
function cycle(v) { return v === "1" ? "2" : v === "2" ? "0" : "1"; }
function badge(v) {
  if (v === "1") return " <span class=\"badge mild\">Mild</span>";
  if (v === "2") return " <span class=\"badge strong\">Strong</span>";
  return "";
}
function render() {
  if (!items.length) {
    document.getElementById("empty").textContent = "No gold-batch2.csv yet. This page will not write the frozen gold.csv.";
    document.querySelector(".card").hidden = true;
    return;
  }
  const x = items[i];
  document.getElementById("progress").textContent = (i + 1) + " / " + items.length;
  document.getElementById("date").textContent = x.date || "No date in this file";
  document.getElementById("outlet").textContent = x.domain || "";
  document.getElementById("en").textContent = x.title_en || x.title || "";
  document.getElementById("ru").textContent = x.title_en ? x.title : "";
  document.getElementById("notes").value = x.notes || "";
  const box = document.getElementById("choices");
  box.innerHTML = "";
  CHOICES.forEach(([key, name]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = key + " " + name;
    if (x.v3 === name) b.className = "on";
    b.onclick = () => choose(name);
    box.appendChild(b);
  });
  const frames = document.getElementById("frames");
  frames.innerHTML = "";
  if (x.v3 !== "Hostile framing") return;
  frames.insertAdjacentHTML("beforeend", "<p>Optional. Tap a frame: Mild, Strong, clear.</p>");
  FRAMES.forEach(([key, name]) => {
    const row = document.createElement("div");
    row.className = "frame";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.onclick = () => { x[key] = cycle(String(x[key] || "")); render(); };
    row.appendChild(b);
    row.insertAdjacentHTML("beforeend", badge(String(x[key] || "")));
    frames.appendChild(row);
  });
}
function payload() {
  const x = items[i];
  x.notes = document.getElementById("notes").value;
  const body = {id: x.id, v3: x.v3 || "", notes: x.notes};
  FRAMES.forEach(([k]) => { body[k] = x.v3 === "Hostile framing" ? (x[k] || "") : ""; });
  return body;
}
async function save() {
  const res = await fetch("/api/save", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload())});
  if (!res.ok) throw new Error("save failed");
}
async function choose(name) {
  const x = items[i];
  x.v3 = name;
  if (name !== "Hostile framing") {
    FRAMES.forEach(([k]) => { x[k] = ""; });
    await save();
    if (i < items.length - 1) i += 1;
  }
  render();
}
document.getElementById("next").onclick = async () => { await save(); if (i < items.length - 1) i += 1; render(); };
document.getElementById("back").onclick = async () => { await save(); if (i > 0) i -= 1; render(); };
document.addEventListener("keydown", (ev) => {
  if (document.activeElement && document.activeElement.id === "notes") return;
  const k = ev.key.toLowerCase();
  if (k === "1") choose("Not about region");
  else if (k === "2") choose("Ordinary news");
  else if (k === "3") choose("Hostile framing");
  else if (k === "u") choose("Unsure");
});
fetch("/api/items").then(r => r.json()).then(data => { items = data; i = firstOpen(); render(); });
</script>
</body>
</html>
