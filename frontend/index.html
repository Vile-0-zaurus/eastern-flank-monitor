<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eastern Flank Monitor</title>
  <link rel="stylesheet" href="styles.css?v=6a27978">
</head>
<body class="main-screen briefing">
  <div id="doors" class="doors" hidden>
    <div class="door door-a"></div>
    <div class="door door-b"></div>
    <button id="skip-doors" type="button">Skip</button>
  </div>
  <header class="top-bar">
    <p id="banner" class="banner"></p>
    <div class="title-row">
      <h1 id="title"></h1>
      <div class="mode-tabs" role="tablist" aria-label="Period">
        <button id="mode-replay" type="button" aria-pressed="true">2021–22 replay</button>
        <button id="mode-now" type="button" aria-pressed="false">Now</button>
      </div>
    </div>
    <p id="now-label" class="now-label" hidden></p>
    <div class="top-strip">
      <p id="region-state" class="region-state"></p>
      <section id="country-strip" aria-label="Finland, Estonia, Latvia, Lithuania, Poland, and Russia"></section>
    </div>
  </header>
  <main class="room">
    <section id="timeline" class="rail" aria-label="Week">
      <button id="play" type="button" aria-pressed="false">Play</button>
      <p id="week-label" class="mono"></p>
      <label class="slider-label">
        <input id="slider" type="range" min="0" value="0">
      </label>
      <div id="week-ticks" class="week-ticks" aria-hidden="true"></div>
      <label class="skip-quiet"><input id="skip-quiet" type="checkbox"> Skip quiet weeks</label>
      <div class="disclaimer-bar rail-foot">
        <p id="disclaimer-short"></p>
        <details>
          <summary id="disclaimer-more"></summary>
          <p id="disclaimer-full"></p>
        </details>
      </div>
    </section>
    <div class="stage">
      <section id="map-panel" aria-label="Map">
        <div class="map-head">
          <h2 id="map-title">Map</h2>
          <p id="map-legend" class="legend">
            <span class="swatch normal">Normal</span>
            <span class="swatch tense">Tense</span>
            <span class="swatch danger">Danger signs</span>
          </p>
        </div>
        <div id="map"></div>
        <p id="map-detail" class="note" hidden></p>
      </section>
      <section id="news-panel" aria-label="News">
        <h2 id="news-title">News</h2>
        <div class="news-filter">
          <button id="filter-all" type="button" aria-pressed="true">All</button>
          <button id="filter-hostile" type="button" aria-pressed="false">Hostile only</button>
        </div>
        <p id="news-note" class="note">Flagged by AI; about 2 in 3 confirmed.</p>
        <div id="news"></div>
      </section>
    </div>
    <aside id="drawer" class="drawer" aria-label="Briefing">
      <h2 id="briefing-title">Lithuania</h2>
      <section id="bottom-line">
        <h3>Bottom line</h3>
        <p id="bottom-line-text"></p>
      </section>
      <div id="country-brief">
        <section id="brief-happened">
          <h3>What happened</h3>
          <div id="region-events"></div>
        </section>
        <section id="officials" aria-label="What officials said">
          <h3>What officials said</h3>
          <div id="officials-ru"></div>
          <div id="officials-west"></div>
        </section>
        <section id="country-news">
          <h3>What Russian media says</h3>
          <h2 id="country-news-title" class="visually-hidden">Lithuania</h2>
          <div id="country-news-list"></div>
        </section>
        <section id="brief-regional">
          <h3>What regional media says</h3>
          <div id="brief-regional-body"></div>
        </section>
      </div>
      <section id="inside-main" aria-label="Inside Russia" hidden>
        <h2>Inside Russia</h2>
        <p id="inside-main-note" class="note"></p>
        <p id="inside-coverage" class="note"></p>
        <p id="inside-volume" class="note"></p>
        <div id="inside-cards"></div>
        <p id="inside-quiet" class="note" hidden></p>
        <section id="inside-background" class="background-box" hidden></section>
      </section>
    </aside>
  </main>
  <script src="app.js?v=6a27978"></script>
</body>
</html>
