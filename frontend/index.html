<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eastern Flank Monitor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="main-screen">
  <header>
    <p id="banner" class="banner"></p>
    <div class="title-row">
      <h1 id="title"></h1>
      <a id="how-link" href="how-it-works.html">How it works</a>
    </div>
  </header>
  <main>
    <aside id="why" hidden>
      <div class="why-head">
        <h2 id="why-title">This week</h2>
        <button id="why-close" type="button">Close</button>
      </div>
      <p id="why-subject"></p>
      <p id="why-quiet" hidden>Quiet week — nothing notable.</p>
      <div id="why-body">
      <h3>What happened</h3>
      <div id="why-events"></div>
      <h3>What official sources say</h3>
      <div id="why-official"></div>
      <h3>What Russian state media says</h3>
      <div id="why-media"></div>
      </div>
    </aside>
    <section id="country-strip" aria-label="Finland, Estonia, Latvia, Lithuania, and Poland"></section>
    <p id="shared-reading" class="note"></p>
    <div class="stage">
      <section id="map-panel" aria-label="Map">
        <h2 id="map-title">Map</h2>
        <div id="map"></div>
        <p id="map-detail" class="note" hidden></p>
      </section>
      <section id="news-panel" aria-label="News">
        <h2 id="news-title">News</h2>
        <div class="news-filter">
          <button id="filter-all" type="button" aria-pressed="true">All</button>
          <button id="filter-hostile" type="button" aria-pressed="false">Hostile only</button>
        </div>
        <p id="news-note" class="note">Flagged by AI; about 2 in 3 confirmed.</p>
        <div id="news"></div>
      </section>
    </div>
    <section id="timeline" aria-label="Week">
      <button id="play" type="button" aria-pressed="false">Play</button>
      <label class="slider-label">
        <span id="week-label"></span>
        <input id="slider" type="range" min="0" value="0">
      </label>
    </section>
  </main>
  <div class="disclaimer-bar">
    <p id="disclaimer-short"></p>
    <details>
      <summary id="disclaimer-more"></summary>
      <p id="disclaimer-full"></p>
    </details>
  </div>
  <script src="app.js"></script>
</body>
</html>
