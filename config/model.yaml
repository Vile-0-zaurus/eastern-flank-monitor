# Draft. The backtest tunes these. Do not treat the numbers as findings.
# Cheap signals weigh less than signals that are expensive to fake.

baseline_days: 180
min_baseline_points: 30
elevated_level: 2
strong_level: 3

# A z-score at or above the value maps to that level. Below the first value is 0.
z_levels:
  1: 0.5
  2: 1.5
  3: 2.5
  4: 3.5

weights:
  intent:
    I1: 1
    I2: 2
    I3: 3
  capability:
    C1: 2
    C2: 3
  opportunity:
    O1: 1
    O2: 1
  hybrid:
    H1: 2
    H2: 3
