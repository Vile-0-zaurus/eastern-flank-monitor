# Pre-registered drafts. See SPEC §5.6. Not computed from the calm period.
# scoring-prereg-v2 replaces mean/SD with median + MAD x 1.4826. Cutoffs unchanged.
# A later change to these cutoffs, weights, or the baseline method must be reported separately in the backtest report.

baseline_days: 180
min_baseline_points: 30
baseline_method: median_mad
mad_scale: 1.4826
elevated_level: 2
strong_level: 3
calibration_start: 2021-01-01
calibration_end: 2021-06-30

# z-score at or above the value maps to that level. Below the first value is 0.
z_levels:
  1: 1.0
  2: 1.5
  3: 2.0
  4: 3.0

weights:
  intent:
    I1: 1
    I2: 2
    I3: 3
  capability:
    C1: 2
    C2: 3
  opportunity:
    O1: 1
    O2: 1
  hybrid:
    H1: 2
    H2: 3
