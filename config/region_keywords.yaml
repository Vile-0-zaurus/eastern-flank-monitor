# Region match rules for pipeline/score/region_filter.py
# Title patterns are stems. The script adds Unicode word boundaries.

location_fips:
  - FI
  - EN
  - LG
  - LH
  - PL

location_names:
  - Kaliningrad
  - Калининград

junk:
  min_title_chars: 15

title_stems:
  ru:
    - финлянд
    - финск
    - финн
    - эстон
    - латв
    - латыш
    - литв
    - литов
    - польш
    - польск
    - поляк
    - прибалт
    - калининград
    - сувалк
    - варшав
    - вильнюс
    - таллин
    - хельсинк
    - рижск
  en:
    - Finland
    - Finnish
    - Estonia
    - Estonian
    - Latvia
    - Latvian
    - Lithuania
    - Lithuanian
    - Poland
    - Polish
    - Warsaw
    - Vilnius
    - Tallinn
    - Riga
    - Helsinki
    - Narva
    - Kaliningrad
    - Suwalki
    - Suwałki

# Short place names that need an explicit ending, not a bare stem.
# Baltic sea-only stems are not here. Only the country phrases, all plural case forms.
title_groups:
  - риг(а|и|е|у|ой)
  - нарв(а|ы|е|у|ой|ск)
  - балтийск(?:ие|их|им|ими)\s+стран(?:ы|ам|ами|ах)?(?!\w)
  - балтийск(?:ие|их|им|ими)\s+государств(?:а|ам|ами|ах)?(?!\w)
  - балтийск(?:ие|их|им|ими)\s+республик(?:и|ам|ами|ах)?(?!\w)
  - Baltic\s+states?(?!\w)
  - Baltic\s+countr(?:y|ies)(?!\w)
  - Baltic\s+nations?(?!\w)
