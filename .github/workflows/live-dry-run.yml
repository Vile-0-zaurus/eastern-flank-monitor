name: Live dry-run

on:
  workflow_dispatch:

jobs:
  one-day:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the filter dependency
        run: python -m pip install requests
      - name: Download and filter one file from one day
        run: python scripts/live/daily_run.py --dry-run --day 2026-11-21 --max-files 1
